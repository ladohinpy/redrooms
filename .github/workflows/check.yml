name: Check Mini App and Subscription

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build and check RedRooms, contests, backups and subscription
        run: node scripts/rr-prepare.cjs && npm run check
